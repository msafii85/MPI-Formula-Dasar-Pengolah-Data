        <p data-template-id="quiz-two-number" class="canva-tag inline-block rounded-full px-3 py-1 text-xs font-extrabold"></p>

        </div>

       <article data-template-id="quiz-three-card" class="canva-card rounded-3xl border p-6">
        <p data-template-id="quiz-three-number" class="canva-tag inline-block rounded-full px-3 py-1 text-xs font-extrabold"></p>
        <h3 data-template-id="quiz-three-question" class="canva-text mt-4 font-bold leading-relaxed"></h3>
        <div class="mt-5 space-y-3" data-question="q3"><button data-template-id="q3-option-a" class="canva-button quiz-option w-full rounded-xl px-4 py-3 text-left font-semibold" data-correct="false" type="button"></button> <button data-template-id="q3-option-b" class="canva-button quiz-option w-full rounded-xl px-4 py-3 text-left font-semibold" data-correct="true" type="button"></button> <button data-template-id="q3-option-c" class="canva-button quiz-option w-full rounded-xl px-4 py-3 text-left font-semibold" data-correct="false" type="button"></button>
        </div>
        <div id="q3-feedback-correct" data-template-id="q3-feedback-correct" class="canva-banner mt-4 hidden rounded-xl px-4 py-3 text-sm"></div>

  <script src="/_sdk/fef09cb5f5b2424b.editing_sdk.js" integrity="sha512-PbmCvZWt+xecnQll4ofK5HTtTS+pGwwY1xn9+p49qHgEHml+uvyc0o1f2Eltkd4t324iwgnf7acUjfnKHkik1w=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      function showSlide(id) {
        document.querySelectorAll(".slide").forEach((slide) => {
          slide.classList.toggle("active", slide.id === id);
        });
        document.getElementById(id).scrollTop = 0;
      }

      document.getElementById("play-button").addEventListener("click", () => showSlide("menu"));

      ["materi", "praktik", "kuis"].forEach((id) => {
        document.getElementById("menu-" + id).addEventListener("click", () => showSlide(id));
      });

      document.querySelectorAll(".back-menu").forEach((button) => {
        button.addEventListener("click", () => showSlide("menu"));
      });

      const sheetData = {
        A2: "Alya", B2: "Buku", C2: "Lunas", D2: 12000, E2: "BK-021",
        A3: "Bima", B3: "Alat Tulis", C3: "Belum", D3: 8000, E3: "AT-114",
        A4: "Citra", B4: "Buku", C4: "Lunas", D4: 15000, E4: "BK-119",
        A5: "Dani", B5: "Alat Tulis", C5: "Lunas", D5: 7000, E5: "AT-220",
        A6: "Eka", B6: "Buku", C6: "Belum", D6: 10000, E6: "BK-301"
      };

      const input = document.getElementById("formula-input");
      const panel = document.getElementById("result-panel");
      const resultLabel = document.getElementById("result-label");
      const resultDetail = document.getElementById("result-detail");

      function showResult(ok, label, detail) {
        panel.className = "mt-5 rounded-2xl border px-5 py-4 " +
          (ok ? "border-green-200 bg-green-50 text-green-900" : "border-red-200 bg-red-50 text-red-900");
        resultLabel.textContent = label;
        resultDetail.textContent = detail;
      }

      function clearHighlights() {
        document.querySelectorAll("[data-cell]").forEach((cell) => {
          cell.classList.remove("active-range");
        });
      }

      function cellsInRange(start, end) {
        const startColumn = start.charCodeAt(0);
        const endColumn = end.charCodeAt(0);
        const startRow = Number(start.slice(1));
        const endRow = Number(end.slice(1));
        const cells = [];

        if (startColumn > endColumn || startRow > endRow) return [];

        for (let column = startColumn; column <= endColumn; column++) {
          for (let row = startRow; row <= endRow; row++) {
            const key = String.fromCharCode(column) + row;
            if (sheetData[key] !== undefined) cells.push(key);
          }
        }

        return cells;
      }

      function highlightRange(start, end) {
        const range = cellsInRange(start, end);
        range.forEach((key) => {
          const cell = document.querySelector('[data-cell="' + key + '"]');
          if (cell) cell.classList.add("active-range");
        });
        return range;
      }

      function normalizeText(text) {
        return String(text).trim().toLowerCase();
      }

      document.getElementById("formula-form").addEventListener("submit", (event) => {
        event.preventDefault();
        clearHighlights();

        const formula = input.value.trim();
        const countIfMatch = formula.match(/^=\s*COUNTIF\s*\(\s*([A-E][2-6])\s*:\s*([A-E][2-6])\s*,\s*"([^"]+)"\s*\)$/i);
        const sumIfMatch = formula.match(/^=\s*SUMIF\s*\(\s*([A-E][2-6])\s*:\s*([A-E][2-6])\s*,\s*"([^"]+)"\s*,\s*([A-E][2-6])\s*:\s*([A-E][2-6])\s*\)$/i);
        const textMatch = formula.match(/^=\s*(UPPER|LOWER|LEFT|RIGHT|MID)\s*\(\s*([A-E][2-6])(?:\s*,\s*(\d+))?(?:\s*,\s*(\d+))?\s*\)$/i);

        if (countIfMatch) {
          const range = highlightRange(countIfMatch[1].toUpperCase(), countIfMatch[2].toUpperCase());
          const criteria = countIfMatch[3];
          const total = range.filter((key) => normalizeText(sheetData[key]) === normalizeText(criteria)).length;

          showResult(
            true,
            "Hasil COUNTIF: " + total,
            'COUNTIF menemukan "' + criteria + '" sebanyak ' + total + " kali pada rentang " + countIfMatch[1].toUpperCase() + ":" + countIfMatch[2].toUpperCase() + "."
          );
          return;
        }

        if (sumIfMatch) {
          const criteriaRange = highlightRange(sumIfMatch[1].toUpperCase(), sumIfMatch[2].toUpperCase());
          const sumRange = highlightRange(sumIfMatch[4].toUpperCase(), sumIfMatch[5].toUpperCase());
          const criteria = sumIfMatch[3];
          const values = [];

          criteriaRange.forEach((criteriaCell, index) => {
            const sumCell = sumRange[index];
            if (sumCell && normalizeText(sheetData[criteriaCell]) === normalizeText(criteria)) {
              values.push(Number(sheetData[sumCell]));
            }
          });

          const total = values.reduce((sum, value) => sum + value, 0);

          showResult(
            true,
            "Hasil SUMIF: " + total.toLocaleString("id-ID"),
            'SUMIF menjumlahkan data dengan kriteria "' + criteria + '".'
          );
          return;
        }

        if (textMatch) {
          const functionName = textMatch[1].toUpperCase();
          const cellRef = textMatch[2].toUpperCase();
          const firstNumber = Number(textMatch[3]);
          const secondNumber = Number(textMatch[4]);
          const value = String(sheetData[cellRef]);

          document.querySelector('[data-cell="' + cellRef + '"]').classList.add("active-range");

          let resultValue = "";

          if (functionName === "UPPER") resultValue = value.toUpperCase();
          if (functionName === "LOWER") resultValue = value.toLowerCase();

          if (functionName === "LEFT") {
            if (!firstNumber) {
              showResult(false, "Jumlah karakter belum lengkap", "Gunakan format seperti =LEFT(E2,2).");
              return;
            }
            resultValue = value.slice(0, firstNumber);
          }

          if (functionName === "RIGHT") {
            if (!firstNumber) {
              showResult(false, "Jumlah karakter belum lengkap", "Gunakan format seperti =RIGHT(E2,3).");
              return;
            }
            resultValue = value.slice(-firstNumber);
          }

          if (functionName === "MID") {
            if (!firstNumber || !secondNumber) {
              showResult(false, "Posisi atau jumlah karakter belum lengkap", "Gunakan format seperti =MID(E2,4,3).");
              return;
            }
            resultValue = value.slice(firstNumber - 1, firstNumber - 1 + secondNumber);
          }

          showResult(
            true,
            "Hasil " + functionName + ": " + resultValue,
            functionName + " mengolah isi sel " + cellRef + ' yang bernilai "' + value + '".'
          );
          return;
        }

        showResult(
          false,
          "Format rumus belum dikenali",
          'Coba gunakan =COUNTIF(C2:C6,"Lunas"), =SUMIF(B2:B6,"Buku",D2:D6), atau =UPPER(A2).'
        );
      });

      document.querySelectorAll(".formula-example").forEach((button) => {
        button.addEventListener("click", () => {
          input.value = button.textContent;
          input.focus();
        });
      });

      document.querySelectorAll("[data-question]").forEach((group) => {
        group.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            if (group.dataset.answered) return;

            group.dataset.answered = "true";
            const correct = button.dataset.correct === "true";

            group.querySelectorAll("button").forEach((option) => {
              option.disabled = true;
              if (option.dataset.correct === "true") option.classList.add("correct");
            });

            if (!correct) button.classList.add("incorrect");

            const feedbackId = group.dataset.question + "-feedback-" + (correct ? "correct" : "wrong");
            document.getElementById(feedbackId).classList.add("feedback-show");
          });
        });
      });
    });
  </script>
